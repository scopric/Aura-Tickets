<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Evo 3D — prova</title>
<link rel="icon" href="data:," />
<!-- Prova local da Fase 2 do Modo Refero (Decisões 244–246), v3 (mais parecido com o 2D, pedido do Ricardo) depois de duas passadas do revisor na v2. Fora das rotas do produto.
     three.js vem da CDN só nesta prova: o app ainda não tem a dependência (decisão do Ricardo, ver a nota do PR).
     No produto o pacote entra pelo npm, em chunk separado por rota. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden;
         font: 400 12px/1.5 ui-sans-serif, system-ui, sans-serif; color: #c6c6c6; }
  /* O poster é o padrão: fica visível até a cena estar pronta. Se o 3D não carregar, ele continua. */
  #poster { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  #cena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease; }
  #cena.pronta { opacity: 1; }
  #cena.pronta + #poster { opacity: 0; transition: opacity 1.2s ease; }
  #poster { transition: none; }
  #rotulo { position: fixed; left: 16px; bottom: 16px; letter-spacing: 0.02em; }
  #rotulo b { color: #fff; font-weight: 400; }
  @media (prefers-reduced-motion: reduce) { #cena, #cena.pronta + #poster { transition: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="cena" aria-label="Evo, mascote da Evokaa, em 3D" role="img"></canvas>
<img id="poster" src="evo-3d-poster.webp" alt="Evo, mascote da Evokaa, em 3D" />
<div id="rotulo"><b>Evo</b> · prova 3D · v3 · <span id="fps"></span></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';

const canvas = document.getElementById('cena');
const anguloFixo = new URLSearchParams(location.search).get('angulo');
const reduzido = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const gl = canvas.getContext('webgl2', { antialias: true, alpha: true });
if (gl) montar(gl); // sem WebGL2 o poster fica (é o padrão do CSS)

function montar(gl) {
  const renderer = new THREE.WebGLRenderer({ canvas, context: gl, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const cena = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(renderer), sala = new RoomEnvironment();
  cena.environment = pm.fromScene(sala, 0.04).texture; pm.dispose(); sala.dispose();
  const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 60);

  // Luz de estúdio: principal branca alta à esquerda, preenchimento frio fraco, contraluz neutra fria (sem violeta: o acento já está no objeto)
  cena.add(new THREE.HemisphereLight(0xffffff, 0x0a0a12, 0.22));
  const principal = new THREE.DirectionalLight(0xffffff, 2.6); principal.position.set(4, 7, 6); cena.add(principal);
  const preench = new THREE.DirectionalLight(0xcfd8ff, 0.4); preench.position.set(-6, 1, 4); cena.add(preench);
  const contra = new THREE.DirectionalLight(0xbfcbff, 0.9); contra.position.set(-3, 5, -7); cena.add(contra);

  // Materiais: acetinado fosco (sem verniz) em tudo; as lentes dos olhos são só um pouco mais lisas
  const branco = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.62, metalness: 0, envMapIntensity: 0.5 });
  const marinho = new THREE.MeshStandardMaterial({ color: 0x0c2340, roughness: 0.55, metalness: 0.05, envMapIntensity: 0.6 });
  const violeta = new THREE.MeshStandardMaterial({ color: 0x8f33f5, roughness: 0.65, metalness: 0, envMapIntensity: 0.4 });
  const lente = new THREE.MeshStandardMaterial({ color: 0x0a1430, roughness: 0.38, metalness: 0, envMapIntensity: 0.3 });
  const topete = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5, metalness: 0, envMapIntensity: 0.5 });
  const esclera = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0, envMapIntensity: 0.4 });
  const iris = new THREE.MeshStandardMaterial({ color: 0x1d68c4, roughness: 0.35, metalness: 0, envMapIntensity: 0.5 });
  const azul = new THREE.MeshStandardMaterial({ color: 0x2f6aa8, roughness: 0.55, metalness: 0.05, envMapIntensity: 0.6 });

  const evo = new THREE.Group();
  const peca = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); evo.add(m); return m; };
  // perfil escrito de cima para baixo; o LatheGeometry quer de baixo para cima (senão as faces viram para dentro)
  const lathe = (pts, mat, y = 0) => peca(new THREE.LatheGeometry(new THREE.SplineCurve(pts.map(([r, h]) => new THREE.Vector2(r, h)).reverse()).getPoints(32), 64), mat, 0, y, 0);

  // Cabeça (centro 2.55, raio 0.95): 38,5% da altura sem o topete, 32,5% com ele (medido pelo revisor)
  const cabeca = peca(new THREE.SphereGeometry(0.95, 64, 48), branco, 0, 2.55, 0); cabeca.scale.set(1, 0.97, 0.98);
  evo.rotation.z = 0.04; // cabeça e corpo levemente inclinados, pose viva
  // Olhos como no 2D: branco, íris azul grande, pupila escura e um brilho pequeno; sobrancelha fina; boca sorrindo
  const naFace = (dir, dist) => dir.clone().normalize().multiplyScalar(dist).add(cabeca.position);
  for (const s of [-1, 1]) {
    const d = new THREE.Vector3(s * 0.38, 0.02, 0.9);
    const branco_ = peca(new THREE.SphereGeometry(0.25, 32, 20), esclera); branco_.position.copy(naFace(d, 0.86)); branco_.lookAt(naFace(d, 5)); branco_.scale.set(1, 1.25, 0.35);
    const ir = peca(new THREE.SphereGeometry(0.17, 32, 20), iris); ir.position.copy(naFace(d, 0.93)); ir.lookAt(naFace(d, 5)); ir.scale.set(1, 1.2, 0.25);
    const pu = peca(new THREE.SphereGeometry(0.095, 24, 16), lente); pu.position.copy(naFace(d, 0.965)); pu.lookAt(naFace(d, 5)); pu.scale.set(1, 1.15, 0.25);
    const br = peca(new THREE.SphereGeometry(0.035, 12, 8), esclera); br.position.copy(naFace(new THREE.Vector3(s * 0.33, 0.1, 0.9), 0.995));
    const sob = peca(new THREE.TorusGeometry(0.2, 0.028, 10, 32, Math.PI * 0.7), marinho); sob.position.copy(naFace(new THREE.Vector3(s * 0.38, 0.42, 0.85), 0.93));
    sob.lookAt(naFace(new THREE.Vector3(s * 0.38, 0.42, 0.85), 5)); sob.rotation.z += Math.PI * 0.15 + s * 0.12;
  }
  const boca = peca(new THREE.TorusGeometry(0.2, 0.03, 10, 32, Math.PI), marinho); boca.position.copy(naFace(new THREE.Vector3(0, -0.42, 0.9), 0.94));
  boca.lookAt(naFace(new THREE.Vector3(0, -0.42, 0.9), 5)); boca.rotation.z += Math.PI;
  const dentro = peca(new THREE.SphereGeometry(0.17, 24, 16), marinho); dentro.position.copy(naFace(new THREE.Vector3(0, -0.47, 0.9), 0.9)); dentro.lookAt(naFace(new THREE.Vector3(0, -0.47, 0.9), 5)); dentro.scale.set(1, 0.5, 0.25);
  // Fones: arco e conchas em laca marinho; anel violeta fosco na concha (a cor da marca, como no 2D)
  const arco = peca(new THREE.TorusGeometry(1.03, 0.08, 16, 64, Math.PI), marinho, 0, 2.55, -0.05); arco.rotation.x = -0.12;
  for (const s of [-1, 1]) {
    peca(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 48), marinho, s * 1.0, 2.52, 0).rotation.z = Math.PI / 2;
    peca(new THREE.TorusGeometry(0.22, 0.025, 12, 48), violeta, s * 1.125, 2.52, 0).rotation.y = Math.PI / 2;
  }
  // Topete: nasce dentro da cabeça, branco na base, azul no meio, violeta na ponta; a ponta se enrola para a frente, como no 2D
  function mecha(pontos, raio, segs = 56) {
    const curva = new THREE.CatmullRomCurve3(pontos.map(p => new THREE.Vector3(...p)));
    const geo = new THREE.TubeGeometry(curva, segs, raio, 20, false);
    const pos = geo.attributes.position, cor = new Float32Array(pos.count * 3);
    const c0 = new THREE.Color(0xf2f2f2), c1 = new THREE.Color(0x1d68c4), c2 = new THREE.Color(0x8f33f5), c = new THREE.Color();
    const p = new THREE.Vector3(), v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      const t = Math.floor(i / 21) / segs;                      // 21 vértices por anel (radialSegments + 1)
      curva.getPointAt(t, p); v.fromBufferAttribute(pos, i).sub(p);
      v.multiplyScalar(Math.pow(1 - t, 0.7) * (0.8 + 0.2 * Math.sin(Math.PI * Math.min(1, t * 1.5 + 0.2)))); // chega a 0 na ponta: tubo fechado
      pos.setXYZ(i, p.x + v.x, p.y + v.y, p.z + v.z);
      (t < 0.3 ? c.lerpColors(c0, c1, t / 0.3) : c.lerpColors(c1, c2, Math.min(1, (t - 0.3) / 0.45))).toArray(cor, i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cor, 3)); // normais do tubo mantidas (sem costura)
    return peca(geo, topete);
  }
  mecha([[0.0, 2.9, 0.1], [0.05, 3.5, 0.0], [0.2, 4.0, 0.25], [0.3, 4.15, 0.75], [0.15, 3.9, 1.05]], 0.46, 64);
  mecha([[-0.3, 2.95, 0.3], [-0.75, 3.2, 0.45], [-1.05, 3.05, 0.6], [-1.2, 2.7, 0.7]], 0.26, 44);

  // Corpo contínuo (lathe): pescoço → ombros → tronco branco; quadril e pernas em marinho; faixa violeta na cintura
  const tronco = lathe([[0.3, 1.7], [0.42, 1.6], [0.64, 1.4], [0.7, 1.05], [0.68, 0.6], [0.63, 0.3], [0.58, 0.15], [0, 0.1]], branco);
  lathe([[0.65, 0.27], [0.635, 0.14]], violeta);                       // faixa
  lathe([[0.59, 0.12], [0.56, -0.15], [0.46, -0.4], [0.3, -0.52], [0, -0.55]], marinho);
  // braço esquerdo (s = 1) relaxado; braço direito (s = -1) levantado, acenando, como na pose 2D. Cada braço gira no ombro.
  for (const s of [-1, 1]) {
    const sobe = s === -1;
    const ombro = new THREE.Group(); ombro.position.set(s * 0.72, 1.28, 0.02); ombro.rotation.z = sobe ? -2.5 : s * -0.1; evo.add(ombro);
    const braco = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.62, 6, 24), branco); braco.position.y = -0.4; ombro.add(braco);
    const mao = new THREE.Mesh(new THREE.SphereGeometry(0.21, 28, 20), azul); mao.position.y = -0.88; mao.scale.set(0.9, 1, 0.75); ombro.add(mao);  // luva, como no 2D
    peca(new THREE.CapsuleGeometry(0.2, 0.4, 6, 24), marinho, s * 0.3, -0.7, 0);
    peca(new THREE.SphereGeometry(0.33, 36, 24), marinho, s * 0.32, -1.12, 0.12).scale.set(0.95, 0.58, 1.3);
  }
  // Marca no peito: decalque projetado no tronco (DecalGeometry do próprio three)
  new THREE.TextureLoader().load('marca.png', tex => {
    if (perdido) { tex.dispose(); return; }
    tex.colorSpace = THREE.SRGBColorSpace;
    const ry = evo.rotation.y, py = evo.position.y; evo.rotation.y = 0; evo.position.y = 0; evo.updateMatrixWorld(true);
    const geo = new DecalGeometry(tronco, new THREE.Vector3(0, 0.95, 0.7), new THREE.Euler(0, 0, 0), new THREE.Vector3(0.5, 0.5, 0.6));
    evo.rotation.y = ry; evo.position.y = py;
    peca(geo, new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6, depthTest: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
    if (!anim) renderer.render(cena, camera);
  });
  cena.add(evo);

  // Enquadramento de objeto: cabe em altura e em largura, com folga
  function enquadrar() {
    const w = canvas.clientWidth, h = canvas.clientHeight, aspect = w / h;
    renderer.setSize(w, h, false); camera.aspect = aspect;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.set(0, 2.0, Math.max(6.2 / (2 * tan), 3.2 / aspect / (2 * tan)) * 1.08);
    camera.lookAt(0, 1.6, 0); camera.updateProjectionMatrix();
    if (!anim) renderer.render(cena, camera);
  }
  addEventListener('resize', enquadrar);

  // Movimento: pose 3/4 fixa com oscilação lenta de ±17° (período 14 s) e flutuação mínima.
  // Parado fora da tela, na aba oculta, com movimento reduzido e depois de perder o contexto.
  const POSE = -0.45;
  let anim = 0, intervalo = 0, visivel = true, perdido = false, quadros = 0, total = 0, t0 = performance.now();
  const relogio = new THREE.Timer(); relogio.connect(document);
  const podeAnimar = () => anguloFixo === null && !reduzido() && visivel && !perdido && !document.hidden;
  function quadro() {
    relogio.update(); const t = relogio.getElapsed();
    evo.rotation.y = anguloFixo !== null ? +anguloFixo : POSE + Math.sin(t * 2 * Math.PI / 14) * 0.3;
    evo.position.y = anguloFixo !== null ? 0 : Math.sin(t * 0.8) * 0.04;
    renderer.render(cena, camera); quadros++; total++;
    anim = podeAnimar() ? requestAnimationFrame(quadro) : 0;
  }
  function ligar() { if (!anim && podeAnimar()) { relogio.reset(); anim = requestAnimationFrame(quadro); } }
  function desligar() { cancelAnimationFrame(anim); anim = 0; }
  const io = new IntersectionObserver(([e]) => { visivel = e.isIntersecting; visivel ? ligar() : desligar(); }); io.observe(canvas);
  const aoVisib = () => document.hidden ? desligar() : ligar(); document.addEventListener('visibilitychange', aoVisib);
  const aoPerder = e => { e.preventDefault(); perdido = true; desligar(); canvas.classList.remove('pronta'); }; canvas.addEventListener('webglcontextlost', aoPerder);
  const mql = matchMedia('(prefers-reduced-motion: reduce)'), aoMudarMov = () => reduzido() ? desligar() : ligar(); mql.addEventListener('change', aoMudarMov);

  enquadrar(); quadro(); canvas.classList.add('pronta');

  // Desmontagem (padrão que vai para o produto): tudo o que foi criado sai da memória
  function destruir() {
    perdido = true; desligar(); clearInterval(intervalo); mql.removeEventListener('change', aoMudarMov); io.disconnect(); removeEventListener('resize', enquadrar); document.removeEventListener('visibilitychange', aoVisib);
    canvas.removeEventListener('webglcontextlost', aoPerder); relogio.dispose();
    cena.traverse(o => { o.geometry?.dispose(); const ms = [].concat(o.material ?? []); ms.forEach(m => { m.map?.dispose(); m.dispose(); }); });
    cena.environment?.dispose(); renderer.dispose(); renderer.forceContextLoss();
  }

  // Medição (só na prova)
  window.medirFPS = (ms = 3000) => new Promise(r => { const q0 = total, i0 = performance.now(); setTimeout(() => r(((total - q0) * 1000 / (performance.now() - i0)).toFixed(1)), ms); });
  window.__evo = { renderer, cena, camera, evo, destruir };
  const fpsEl = document.getElementById('fps');
  if (anguloFixo !== null) fpsEl.textContent = 'pose fixa';
  else intervalo = setInterval(() => { fpsEl.textContent = `${(quadros * 1000 / (performance.now() - t0)).toFixed(0)} fps`; quadros = 0; t0 = performance.now(); }, 1000);
}
</script>
</body>
</html>

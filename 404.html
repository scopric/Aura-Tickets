<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aura Eventos</title>
    <script>
      // SPA redirect: redirect all routes to index.html
      var l = window.location;
      l.replace(l.protocol + '//' + l.host + '/#' + l.pathname + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>

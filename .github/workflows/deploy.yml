name: Deploy & CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd app
          npm ci --legacy-peer-deps

      # Portão de segurança (decisão 101): barra dependência de produção com falha alta ou crítica.
      - name: Audit Production Dependencies
        run: |
          cd app
          # Repete uma vez: o servidor de audit do npm às vezes falha por rede; falha real falha de novo.
          npm audit --omit=dev --audit-level=high || { sleep 10; npm audit --omit=dev --audit-level=high; }

      - name: Run Lint Check
        run: |
          cd app
          npm run lint || echo "Lint warnings found but build validation continues."

      - name: Build
        run: |
          cd app
          npm run build

      # Checagem de tipos: o projeto tem centenas de erros herdados (27/09/2026), então ainda não bloqueia.
      # Meta: zerar os erros e tirar o continue-on-error (aí o CI passa a barrar tipo errado).
      - name: Type Check (non-blocking)
        continue-on-error: true
        run: |
          cd app
          npx tsc -b --pretty false > tsc.log || true
          echo "Erros de tipo: $(grep -c 'error TS' tsc.log || true)"
          tail -n 30 tsc.log

      # Suíte unitária legada em reparo: reporta resultado mas não bloqueia o pipeline.
      # O portão que bloqueia hoje é o build (vite build); a checagem de tipos acima ainda não.
      - name: Run Unit Tests (non-blocking)
        continue-on-error: true
        run: |
          cd app
          npm run test -- --run

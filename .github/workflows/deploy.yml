name: Deploy & CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd app
          npm ci --legacy-peer-deps

      - name: Run Lint Check
        run: |
          cd app
          npm run lint || echo "Lint warnings found but build validation continues."

      - name: Run Type Check & Build
        run: |
          cd app
          npm run build
